# ============================================================
# config.yaml — Fichier de description de l'add-on Home Assistant
# ============================================================
# Ce fichier ne contient PAS de logique : c'est une fiche d'identité
# que le Supervisor HAOS lit pour savoir comment construire et lancer
# le conteneur, et quelles permissions système lui accorder.

name: "Bluetooth Audio Bridge"
# Nom affiché dans l'interface Home Assistant (Paramètres > Applications).
# Renommé le 2026-08-20 (choix validé avec l'utilisateur) : l'add-on
# n'est plus seulement un pont MPD, il expose aussi un media_player natif
# (DLNA) — "Bluetooth Audio Bridge" reste proche de l'ancien nom
# ("Bluetooth Speaker MPD Bridge") sans se limiter à MPD.
# Ancien nom : "Bluetooth Speaker MPD Bridge" (ancien nom encore avant :
# "MPD JBL Bridge").

version: "2.2.0"
# Version de l'add-on. À incrémenter à chaque modification si on veut
# que le Supervisor propose une "mise à jour" plus tard.
# Bump en 2.0.0 : changement de nom/slug (rupture de compatibilité pour
# quiconque avait déjà installé la v1 sous l'ancien slug "mpd_jbl_bridge").
# Bump en 2.0.1 : correctif du profil audio PulseAudio (voir CHANGELOG).
# Bump en 2.1.0 (2026-08-20) : enable_mpd + media_player natif (Phase 1/2)
# + renommage en "Bluetooth Audio Bridge" (slug bluetooth_audio_bridge).
# Bump en 2.2.0 (2026-08-22) : option `default_volume`, correctif du
# volume/mute du sink PulseAudio resté silencieux (voir CHANGELOG,
# signalé par la GitHub issue #1).

slug: "bluetooth_audio_bridge"
# Identifiant technique unique de l'add-on (utilisé dans les URLs internes,
# les noms de conteneur Docker, etc.). Pas d'espace, pas d'accent.
# Changé le 2026-08-20 depuis "mpd_bluetooth_bridge" en même temps que le
# nom (voir ci-dessus) — accessoirement, ce changement de slug contourne
# aussi un bug de cache Supervisor découvert sur l'instance HA de test qui
# bloquait "mpd_bluetooth_bridge" sur un très vieux build (voir le journal
# du projet dans le vault pour le détail).

description: "Connect any Bluetooth speaker to Home Assistant as a native media_player, with optional MPD/Music Assistant support."
# En anglais : c'est ce texte qui s'affiche dans le magasin d'add-ons HA,
# dont l'audience est la communauté internationale, pas seulement toi.

url: "https://github.com/dcybeldesign/ha-mpd-bluetooth-bridge"
# À adapter si le dépôt communautaire est finalement créé sous un autre
# nom/compte — voir le dépôt réel une fois poussé.

arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
# Les 5 architectures supportées par les images de base officielles HA.
# Rien dans ce projet n'est spécifique au matériel Raspberry Pi : Bluetooth
# (bluetoothctl/D-Bus) et audio (PulseAudio partagé du Supervisor) sont des
# services fournis de la même façon par HAOS quel que soit le hardware.
# Testé concrètement sur Raspberry Pi 4 (aarch64) ; les autres architectures
# reposent sur le même mécanisme mais n'ont pas toutes été testées en
# conditions réelles — retours de la communauté bienvenus (voir README).
# Voir build.yaml pour l'image de base utilisée par architecture.

startup: services
# Indique au Supervisor que cet add-on doit démarrer après les services
# de base (réseau, dbus, audio) mais peut tourner en tâche de fond en continu.

boot: auto
# Démarre automatiquement l'add-on en même temps que Home Assistant
# (pratique : pas besoin de le relancer à la main après un redémarrage).

init: false
# Désactive le système d'init par défaut du conteneur (S6-overlay minimal) :
# c'est NOTRE script run.sh qui pilotera tout, pas un init générique.

# --- Accès système nécessaires ---
# C'est la partie la plus importante : sans ces lignes, le conteneur est
# isolé et ne peut ni jouer du son, ni piloter le Bluetooth de l'hôte.

audio: true
# Donne accès au serveur audio partagé du Supervisor. Sans ça, MPD n'aurait
# aucune sortie son disponible.

host_dbus: true
# Donne accès au bus D-Bus du système hôte. C'est INDISPENSABLE pour
# piloter bluetoothd (reconnexion automatique à l'enceinte) depuis le
# conteneur, exactement comme `bluetoothctl` le ferait depuis un shell SSH.

# --- Réseau ---
host_network: true
# Nécessaire pour le media_player natif (DLNA/UPnP, voir gmediarender dans
# run.sh) : la découverte automatique par Home Assistant repose sur SSDP,
# un protocole multicast qui ne traverse pas correctement le réseau bridge
# isolé de Docker. Avec host_network, le conteneur utilise directement la
# pile réseau de l'hôte — l'add-on voit (et est visible sur) tout le réseau
# local, pas seulement les ports explicitement mappés. Conséquence directe :
# la table "ports" ci-dessous devient purement documentaire (host_network
# expose déjà tous les ports du conteneur tels quels, sans mapping Docker).

ports:
  6600/tcp: 6600
  # MPD écoute par défaut sur le port 6600 (protocole texte MPD).
  # On l'expose tel quel pour que Music Assistant (fournisseur "MPD Players")
  # puisse s'y connecter. Le port externe reste modifiable par l'utilisateur
  # depuis l'onglet Réseau de l'add-on si besoin (mécanisme standard HAOS,
  # rien à coder pour ça).

ports_description:
  6600/tcp: "MPD protocol port, used by Music Assistant to control playback."

# --- Options configurables depuis l'interface Home Assistant ---
# C'est ici que l'utilisateur final renseigne les informations propres à
# SON installation (son enceinte à lui) — rien de spécifique à une
# installation particulière n'est plus codé en dur dans le projet.

options:
  bluetooth_mac: ""
  speaker_name: "Bluetooth Speaker"
  reconnect_interval: 30
  enable_mpd: true
  default_volume: 70
  # Pas de valeur par défaut pour bluetooth_mac : c'est un champ obligatoire
  # (voir schema ci-dessous, pas de "?" après "match(...)"), l'utilisateur
  # DOIT renseigner l'adresse MAC de sa propre enceinte avant de démarrer.
  # enable_mpd par défaut à true : préserve le comportement actuel (musique
  # via MPD/Music Assistant) pour quiconque utilise déjà ce chemin — le
  # media_player natif à venir (Phase 2) sera un ajout, pas un remplacement.
  # default_volume à 70 : valeur de repli raisonnable, ni inaudible ni trop
  # fort d'office (voir schema et run.sh pour son usage exact).

schema:
  bluetooth_mac: "match(^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$)"
  # Valide le format d'une adresse MAC Bluetooth (ex: AA:BB:CC:DD:EE:FF) et
  # affiche une erreur claire dans l'UI si l'utilisateur se trompe de format,
  # plutôt qu'un échec silencieux au démarrage du conteneur.

  speaker_name: "str"
  # Nom cosmétique affiché côté MPD pour cette sortie audio (n'affecte pas
  # le fonctionnement, juste la lisibilité si on a plusieurs sorties MPD).

  reconnect_interval: "int(10,300)"
  # Intervalle (en secondes) entre deux vérifications de la connexion
  # Bluetooth. Bornes raisonnables : entre 10s (réactif mais plus de trafic
  # Bluetooth) et 300s (5 min, économe mais reconnexion plus lente après
  # une coupure).

  enable_mpd: "bool"
  # Permet de désactiver complètement le serveur MPD (ex: si seul le futur
  # media_player natif est souhaité). L'enceinte reste connectée en
  # Bluetooth dans les deux cas ; seul le lancement de MPD est conditionné.

  default_volume: "int(1,100)"
  # Volume (%) restauré automatiquement sur le sink PulseAudio de l'enceinte
  # si celui-ci est détecté muet ou à 0% (voir run.sh, ensure_audio_sink) —
  # un cas signalé par un utilisateur (GitHub issue #1) : ce sink peut rester
  # silencieux indéfiniment (y compris après un reboot) sans qu'aucune
  # erreur ne remonte, si rien d'autre sur le système ne l'a jamais remonté.
  # N'écrase jamais un volume choisi par l'utilisateur tant qu'il n'est pas
  # à 0% — pas de reset périodique intrusif. Minimum à 1 (pas 0) pour éviter
  # une configuration qui neutraliserait silencieusement ce correctif.
