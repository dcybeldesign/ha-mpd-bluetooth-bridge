# ============================================================
# httpd.conf — Configuration du serveur web de la page d'appairage
# ============================================================
# Lu par httpd de busybox-extras, lancé par run.sh (étape 1ter).
#
# Seule règle, mais essentielle : n'accepter QUE le proxy ingress du
# Supervisor (172.30.32.2), comme l'impose la documentation officielle des
# add-ons. L'add-on tourne en host_network : sans ce filtre, n'importe
# quelle machine capable de joindre l'adresse d'écoute pourrait piloter
# l'appairage Bluetooth de l'hôte sans passer par l'authentification de
# Home Assistant. run.sh limite déjà l'écoute à l'adresse interne du
# Supervisor ; ce filtre est une seconde barrière, et les scripts CGI
# revérifient encore l'adresse (voir require_ingress dans lib/btui.sh).
#
# Logique busybox : les règles "D:" (deny) passent avant les "A:" (allow),
# et "D:*" (tout refuser) est appliqué en dernier.

A:172.30.32.2
D:*
