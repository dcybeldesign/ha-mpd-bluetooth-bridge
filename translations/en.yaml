configuration:
  bluetooth_mac:
    name: Bluetooth MAC address
    description: >-
      MAC address of the primary Bluetooth speaker (format
      AA:BB:CC:DD:EE:FF). Filled in automatically when you pick a speaker
      in the add-on's "Bluetooth Audio" panel. Leave empty on a first
      install: the add-on then starts in setup mode, with only its pairing
      page running.
  speaker_name:
    name: Speaker name
    description: >-
      Name of the primary speaker, shown for its native media_player and
      its MPD output. Does not affect functionality.
  reconnect_interval:
    name: Reconnect check interval (seconds)
    description: >-
      How often the add-on checks whether the speaker is still connected,
      and reconnects it automatically if not (10-300 seconds).
  enable_mpd:
    name: Enable MPD server
    description: >-
      Start the MPD server for use with Music Assistant's "MPD Players"
      provider. The Bluetooth connection and the native media_player
      output are unaffected either way; turn this off if you only want
      the native media_player and don't use Music Assistant.
  default_volume:
    name: Default volume (%)
    description: >-
      Volume automatically restored if the speaker's PulseAudio sink is
      ever found muted or at 0% (which otherwise stays silent
      indefinitely, even across reboots, with no visible error). Never
      overrides a volume you've deliberately set as long as it isn't 0%.
  extra_speakers:
    name: Extra speakers
    description: >-
      Optional additional Bluetooth speakers (MAC address and name each),
      each with its own native media_player. Can also be added from the
      "Bluetooth Audio" panel after pairing. MPD stays on the primary
      speaker only.
